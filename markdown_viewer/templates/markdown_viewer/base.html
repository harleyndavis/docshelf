<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Docs{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      background: #f8f8f8;
    }

    header {
      background: #1a1a1a;
      padding: 0.75rem 2rem;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }

    main {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Markdown content styles */
    .prose h1, .prose h2, .prose h3, .prose h4 { margin: 1.5rem 0 0.5rem; font-weight: 600; }
    .prose h1 { font-size: 2rem; border-bottom: 2px solid #e0e0e0; padding-bottom: 0.3rem; }
    .prose h2 { font-size: 1.5rem; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.2rem; }
    .prose h3 { font-size: 1.2rem; }
    .prose p { margin: 0.75rem 0; }
    .prose a { color: #0066cc; }
    .prose ul, .prose ol { margin: 0.75rem 0 0.75rem 1.5rem; }
    .prose li { margin: 0.25rem 0; }
    .prose blockquote {
      border-left: 4px solid #ccc;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
      color: #555;
      background: #f0f0f0;
    }
    .prose pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .prose code {
      background: #e8e8e8;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .prose pre code { background: none; padding: 0; }
    .prose table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    .prose th, .prose td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; }
    .prose th { background: #f0f0f0; font-weight: 600; }
    .prose img { max-width: 100%; height: auto; }
    .prose hr { border: none; border-top: 1px solid #ddd; margin: 1.5rem 0; }

    /* Index page */
    .page-title { margin-bottom: 1.5rem; font-size: 1.8rem; font-weight: 600; }
    .doc-list { list-style: none; padding: 0; }
    .doc-list li { margin: 0.5rem 0; }
    .doc-list a {
      display: inline-block; padding: 0.4rem 0.75rem; border-radius: 4px;
      background: #fff; border: 1px solid #ddd; color: #0066cc;
      text-decoration: none; font-size: 1rem;
    }

    /* Document page */
    .back-nav { margin-bottom: 1.5rem; }
    .back-nav a { color: #666; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <a href="/">Markdown Docs</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
